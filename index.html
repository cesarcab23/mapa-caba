<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mapa de Usos CABA</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--ink:#1d2421;--muted:#5d6863;--line:#d9ddd9;--accent:#0f6b5c;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--panel:#1b211f;--ink:#e6ebe8;--muted:#9aa5a0;--line:#2e3633;--accent:#4fb8a3;--accent-ink:#0d1412;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px}p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
label.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.err{color:var(--err);font-size:14px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Mapa de Usos CABA</h1>
  <p>Ingresá la contraseña para entrar.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required autofocus>
  <label class="rem"><input type="checkbox" id="rem"> Recordar en este dispositivo</label>
  <button type="submit" id="go">Entrar</button>
  <p class="err" id="err" hidden>Contraseña incorrecta.</p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=new TextEncoder(),base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
  return new TextDecoder().decode(plain)}
async function tryPw(pw,remember){
  try{const html=await unlock(pw);
    try{if(remember)localStorage.setItem("mapa_pw",pw);sessionStorage.setItem("mapa_pw",pw)}catch(e){}
    document.open();document.write(html);document.close();return true}
  catch(e){return false}}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("go");b.disabled=true;b.textContent="Abriendo…";
  const ok=await tryPw(document.getElementById("pw").value,document.getElementById("rem").checked);
  if(!ok){b.disabled=false;b.textContent="Entrar";document.getElementById("err").hidden=false;document.getElementById("pw").select()}});
(async()=>{let pw=null;try{pw=sessionStorage.getItem("mapa_pw")||localStorage.getItem("mapa_pw")}catch(e){}
  if(pw&&!(await tryPw(pw,false))){try{localStorage.removeItem("mapa_pw");sessionStorage.removeItem("mapa_pw")}catch(e){}}})();
</script>
